name: CI Docker Citation du Jour

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-quality:
    name: Lint & Tests (Vraie BDD)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: citation_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Installation des dépendances (Monorepo)
        run: npm install

      - name: 🛠️ Initialisation de la base de données (Tables)
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=test_password psql -h localhost -U test_user -d citation_db -f backend/init.sql

      - name: 🔍 Exécution du Lint (Syntaxe)
        run: npm run lint

      - name: 🧪 Exécution des Tests avec la vraie BDD
        env:
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: citation_db
        run: npm test

  docker-build:
    name: Build Docker
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🐳 Test de construction des images
        run: docker compose build